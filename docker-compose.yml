# IoBuild Monolith — Docker Compose
# Monorepo con Backend .NET 9 (IoBuild.Api) + Frontend Vue SPA (Vite/Nginx) + MySQL 8.0 + Mosquitto MQTT + IoT Simulator
services:
  iobuild-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: iobuild-api
    restart: unless-stopped
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__IoBuild=${ConnectionStrings__IoBuild:-Server=mysql-monolith;Port=3306;Database=iobuild;User=root;Password=${DB_PASSWORD:-iobuild}}
      - Migrations__ApplyOnStartup=true
      - Mqtt__Enabled=true
      - Mqtt__Host=mosquitto
      - Mqtt__Port=1883
      - Jwt__Secret=${JWT_SECRET:-iobuild-production-secret-must-be-replaced-in-prod-32chars!}
      - Cors__AllowedOrigins=${CORS_ALLOWED_ORIGINS:-*}
    depends_on:
      mysql-monolith:
        condition: service_healthy
      mosquitto:
        condition: service_started
    networks:
      - iobuild-network
    expose:
      - "8080"
    ports:
      - "8080:8080"
      - "5080:8080"

  mysql-monolith:
    image: mysql:8.0
    container_name: iobuild-mysql-monolith
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-iobuild}
      - MYSQL_DATABASE=iobuild
    volumes:
      - mysql_monolith_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - iobuild-network

  # Frontend — Vue SPA construida con Vite (Nginx interno expone dist en puerto 80)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api/v1
    container_name: iobuild-frontend
    restart: unless-stopped
    depends_on:
      - iobuild-api
    networks:
      - iobuild-network
    expose:
      - "80"

  # Nginx Reverse Proxy — Enruta peticiones externas: /api/* -> backend:8080, /* -> frontend:80
  nginx:
    image: nginx:alpine
    container_name: iobuild-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - iobuild-api
      - frontend
    networks:
      - iobuild-network

  # Mosquitto — Broker MQTT para telemetría IoT de áreas comunes
  mosquitto:
    image: eclipse-mosquitto:2-openssl
    container_name: iobuild-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    networks:
      - iobuild-network

  # IoT Simulator — Generador continuo de telemetría de áreas comunes (cisterna, bombas, ascensores, tablero)
  simulator:
    build:
      context: ./iot-simulator
      dockerfile: Dockerfile
    container_name: iobuild-simulator
    restart: unless-stopped
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
    depends_on:
      - mosquitto
    networks:
      - iobuild-network

networks:
  iobuild-network:
    driver: bridge

volumes:
  mysql_monolith_data:
    driver: local
  mosquitto_data:
    driver: local
